services:
  web:
    build: .
    image: stagematch:latest
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - API_URL=http://api:5001
      - DB_CONNECTION_STRING=/app/database_files/users.db
    depends_on:
      - api
    volumes:
      - db_data:/app/database_files

  api:
    image: stagematch:latest
    restart: unless-stopped
    command: python server.py
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT_API=5001
    expose:
      - "5001"

volumes:
  db_data:
